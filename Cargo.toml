[package]
name = "tunefast"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Tunefast: a fast, native desktop app built with Rust and iced"
repository = "https://github.com/Readtt/tunefast"
publish = false

[[bin]]
name = "tunefast"
path = "src/main.rs"

[features]
default = []
# The GPU renderer (wgpu). Off by default: on Windows the CPU renderer
# (tiny-skia) idles at ~13 MB against ~148 MB for wgpu, with similar redraw
# cost at desktop window sizes. Turn this on only for heavy animation, video
# or large canvases, and benchmark both.
gpu = ["iced/wgpu"]

[dependencies]
anyhow = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
# The UI, drawn on the CPU with tiny-skia: no GPU driver in the process.
# `tokio` runs Task futures on tokio so reqwest and websockets work.
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "crisp", "web-colors", "tokio", "svg", "image", "markdown", "advanced", "advanced-shaping", "x11", "wayland", "linux-theme-detection"] }
tokio = { version = "1", features = ["time", "sync", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip", "http2"] }
# PNG writing for --screenshot.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
# Embeds assets/icon.ico as the executable's icon in Explorer and the taskbar.
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

# iced_graphics 0.14.0 with a damage-grouping fix (vendor/iced_graphics/PATCH.md):
# without it, scrolling a list can take 120 ms a frame on the CPU renderer.
[patch.crates-io]
iced_graphics = { path = "vendor/iced_graphics" }
