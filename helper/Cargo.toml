[package]
name = "tunefast-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Tunefast's hardware helper: a small Windows service that makes the few firmware calls the window asks for"
publish = false

[[bin]]
name = "tunefast-helper"
path = "src/main.rs"

[dependencies]
tunefast-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
wmi = { version = "0.18", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
